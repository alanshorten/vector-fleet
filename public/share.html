<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TailiQ — Shared Tech Spec</title>
<!-- Same pure-JS builders the main app uses — no React/Babel/Firebase needed
     for this page, since it only ever reads allowlisted data returned by
     the public /api/share/{token} function. -->
<script src="/calculations/llpCalculator.js"></script>
<script src="/calculations/techSpecBuilder.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow','Segoe UI',sans-serif;background:#F2F1EC;color:#151A1D;min-height:100vh}
.wrap{max-width:900px;margin:0 auto;padding:32px 16px}
.center{display:flex;align-items:center;justify-content:center;height:100vh;text-align:center;padding:24px}
.card{background:#FCFCF9;border:1px solid #D9DCD8;border-radius:4px;padding:28px;max-width:420px}
.gold{color:#151A1D;font-weight:700}
.muted{color:#687078;font-size:13px;margin-top:8px;line-height:1.6}
iframe{width:100%;border:none;background:#FCFCF9;border-radius:4px;min-height:80vh}
.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px}
.btn{cursor:pointer;border:none;border-radius:4px;font-family:inherit;font-weight:700;font-size:13px;padding:8px 16px}
.btn-gold{background:#151A1D;color:#F2F1EC}
.btn-gold:hover{background:#687078}
.spinner{width:28px;height:28px;border:3px solid #D9DCD8;border-top-color:#151A1D;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root">
  <div class="center"><div><div class="spinner"></div><div class="muted">Loading shared tech spec…</div></div></div>
</div>
<script>
(async function(){
  const root = document.getElementById('root');

  function showError(message){
    root.innerHTML = '';
    const center = document.createElement('div');
    center.className = 'center';
    center.innerHTML = `
      <div class="card">
        <div class="gold" style="font-size:16px;margin-bottom:10px">TailiQ</div>
        <div style="font-size:14px;font-weight:600">${message}</div>
        <div class="muted">If you believe this is a mistake, ask the sender for a fresh share link.</div>
      </div>`;
    root.appendChild(center);
  }

  // The browser URL stays as /share/{token} even though vercel.json rewrites
  // this request to /share.html?token={token} server-side — a rewrite
  // changes what's served, not what's shown in the address bar. So we read
  // the token from the path the visitor actually has, with the query string
  // kept only as a fallback (handy for testing this file directly).
  const pathParts = window.location.pathname.split('/').filter(Boolean);
  let token = pathParts[0] === 'share' ? pathParts[1] : null;
  if (!token) token = new URLSearchParams(window.location.search).get('token');
  if (!token) { showError('Missing share link token.'); return; }

  let res;
  try {
    res = await fetch('/api/share/' + encodeURIComponent(token));
  } catch (e) {
    showError('Could not reach TailiQ — check your connection and try again.');
    return;
  }

  if (!res.ok) {
    const map = { 404: 'This share link was not found.', 410: 'This share link has expired or been revoked.' };
    showError(map[res.status] || 'This share link could not be loaded.');
    return;
  }

  const { asset, defaultDisclaimer, hideBranding } = await res.json();

  // Standalone-engine prospects (Prospect Asset Flow), and single-engine
  // shares carved out of a two-engine aircraft prospect (asset._engineOnly,
  // set server-side by /api/share/[token] when the token is engine-scoped),
  // must render via the engine-only branch of buildTechSpecHTML — same
  // derivation as generateTechSpec() in the main app. Without this, a
  // shared engine would render as a full (and largely blank) aircraft spec.
  const specAsset = (asset.prospectKind === 'engine' || asset._engineOnly)
    ? { ...asset, _engineOnly: true, _enginePos: asset._enginePos || 1 }
    : asset;

  // buildTechSpecHTML is the SAME function the authenticated app uses to
  // generate the printable tech spec — see /calculations/techSpecBuilder.js.
  const html = buildTechSpecHTML(specAsset, '', null, defaultDisclaimer, '', !!hideBranding);

  root.innerHTML = '';
  const bar = document.createElement('div');
  bar.className = 'wrap';
  bar.innerHTML = `
    <div class="bar">
      <span class="gold" style="flex:1;font-size:14px">TailiQ — Shared Tech Spec (read-only)</span>
      <button class="btn btn-gold" id="printBtn">🖨 Print / Save PDF</button>
    </div>`;
  const iframeWrap = document.createElement('div');
  iframeWrap.className = 'wrap';
  iframeWrap.style.paddingTop = '0';
  const iframe = document.createElement('iframe');
  iframeWrap.appendChild(iframe);

  document.body.appendChild(bar);
  document.body.appendChild(iframeWrap);

  iframe.srcdoc = html;
  iframe.onload = () => {
    try { iframe.style.height = (iframe.contentWindow.document.body.scrollHeight + 40) + 'px'; } catch (e) {}
  };

  document.getElementById('printBtn').addEventListener('click', () => {
    try { iframe.contentWindow.print(); } catch (e) {}
  });
})();
</script>
</body>
</html>
