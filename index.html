<!-- Third-party libs used as bare globals (window.pdfjsLib, window.mammoth,
     window.Chart) by components — left as classic CDN scripts, unchanged from the
     single-file app. Not converted to npm packages in this migration pass.

     xlsx (SheetJS) removed 2026-08 as part of the xlsx remediation (Option D —
     see claude_xlsx-remediation-option-d-build-handoff.md): SheetJS 0.18.5 has
     an unpatched prototype-pollution CVE with no npm fix, and all Excel parsing
     (client and server) has been consolidated server-side onto ExcelJS via
     /api/parse-excel, so no client-side Excel library is loaded here anymore.

     SRI (Phase 4 / L-01, security-remediation-roadmap.md): integrity hashes below
     were computed from the npm-published packages at the pinned versions
     (pdfjs-dist 3.11.174, mammoth 1.7.0, chart.js 4.5.0), since this build
     environment has no direct network path to cdnjs.cloudflare.com to hash the
     live response. cdnjs mirrors these exact npm/release artifacts, so the hashes
     should match, but re-verify against the live CDN URL before relying on this
     in production (e.g. `curl -sL <url> | openssl dgst -sha384 -binary | openssl
     base64 -A`) — a mismatch will hard-block the script from loading (SRI fails
     closed), not silently degrade. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" integrity="sha384-/1qUCSGwTur9vjf/z9lmu/eCUYbpOTgSjmpbMQZ1/CtX2v/WcAIKqRv+U1DUCG6e" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.7.0/mammoth.browser.min.js" integrity="sha384-XsDe9keS+6qnJvogt5RdvXf7GBLzUYIb8TiVP3pHI4/oBwvxwdkCMiesydsYgRdF" crossorigin="anonymous"></script>
<!-- Chart.js — used only by the Fly-Forward Demo view (sample-data validation, not live) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.5.0/chart.umd.min.js" integrity="sha384-XcdcwHqIPULERb2yDEM4R0XaQKU3YnDsrTmjACBZyfdVVqjh6xQ4/DCMd7XLcA6Y" crossorigin="anonymous"></script>
<script>
  // Note: pdf.worker.min.js is loaded via pdfjsLib's internal worker-fetch
  // mechanism (a runtime workerSrc assignment, not a static <script> tag), so
  // the HTML `integrity` attribute cannot be applied to it directly — the
  // browser has no SRI hook for that load path. Its computed hash (from the
  // matching pdfjs-dist 3.11.174 npm release) is recorded here for reference
  // if a future pass adds a manual fetch+verify wrapper:
  // sha384-SnzOobpRMLXZ52iJvZm/C0fYw0OQemTXzTjIsdsfMcrCtCEe9qgzxTd3RSklO5x2
  if(window.pdfjsLib){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';}
</script>

<!-- Firebase init — unchanged from the single-file app. Runs as its own inline
     module script; sets window._firestore / window._auth / window._cloudinaryConfig
     and dispatches firebase-ready / auth-state-changed / firebase-config-error
     events that App.jsx listens for. -->
<script type="module" id="firebase-init">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
  import { getFirestore, collection, doc, getDoc, getDocs, setDoc, deleteDoc, addDoc, query, where, orderBy, writeBatch, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, confirmPasswordReset, verifyPasswordResetCode } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";

  // Firebase web config + Cloudinary cloud name/upload preset are not
  // secrets (Firebase web config and an unsigned Cloudinary preset are
  // designed to be public client-side) — this fetch exists only to keep
  // them out of GitHub history, via /api/config reading Vercel env vars.
  let cfg;
  try {
    const res = await fetch('/api/config');
    cfg = await res.json();
  } catch (e) {
    console.error('Failed to load /api/config', e);
    window._configError = true;
    window.dispatchEvent(new Event('firebase-config-error'));
  }

  if (cfg) {
    window._cloudinaryConfig = cfg.cloudinary;

    const app = initializeApp(cfg.firebase);
    const db = getFirestore(app);
    const auth = getAuth(app);
    // serverTimestamp added Phase 3 Session 7 (3D / M-03, security-
    // remediation-roadmap.md) — logAudit() in db.js now uses it so
    // firestore.rules can validate the write's timestamp against
    // request.time and reject forged/backdated audit entries.
    window._firestore = { db, collection, doc, getDoc, getDocs, setDoc, deleteDoc, addDoc, query, where, orderBy, writeBatch, serverTimestamp };

    // --- Minimal auth layer ---
    // Exposes a small bridge on window so the React app (App.jsx, SetPasswordScreen)
    // can sign in/out and react to auth state. Firestore rules are the real gate;
    // this is what lets the UI know whether to show the app or a sign-in screen.
    window._auth = {
      signIn: (email, password) => signInWithEmailAndPassword(auth, email, password),
      signOut: () => signOut(auth),
      // Used to authenticate calls to admin-only serverless functions (e.g.
      // /api/invite-user) — the function verifies this token server-side
      // rather than trusting any client-supplied flag.
      getIdToken: () => auth.currentUser ? auth.currentUser.getIdToken() : Promise.resolve(null),
      // Used to read Firebase custom claims (e.g. role) for the signed-in user.
      // Pass forceRefresh=true after a claim has just been set server-side.
      getIdTokenResult: (forceRefresh=false) => auth.currentUser ? auth.currentUser.getIdTokenResult(forceRefresh) : Promise.resolve(null),
      // Used by the set-password view reached via the invite email link.
      verifyResetCode: (oobCode) => verifyPasswordResetCode(auth, oobCode),
      confirmReset: (oobCode, newPassword) => confirmPasswordReset(auth, oobCode, newPassword)
    };

    // Only now is everything window.* code outside this module might touch
    // (firestore helpers AND auth bridge) actually assigned. Previously this
    // fired right after _firestore was set, before window._auth existed —
    // any listener reacting immediately (e.g. SetPasswordScreen) would find
    // window._auth undefined and crash.
    window._firebaseReady = true;
    window.dispatchEvent(new Event('firebase-ready'));

    onAuthStateChanged(auth, (user) => {
      window._authUser = user ? { uid: user.uid, email: user.email } : null;
      window.dispatchEvent(new Event('auth-state-changed'));
    });
  }
</script>
